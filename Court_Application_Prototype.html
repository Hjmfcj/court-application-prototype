<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Court Application — Interactive Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --navy:#1B3A5C; --navy-dark:#122841; --teal:#2E7D6B;
    --bg:#F5F7F9; --card:#FFFFFF; --border:#E1E5EA;
    --text:#1F2937; --text-mute:#6B7280;
    --amber:#B45309; --amber-bg:#FEF3C7;
    --green:#166534; --green-bg:#DCFCE7;
    --red:#991B1B; --red-bg:#FEE2E2;
    --blue:#1E40AF; --blue-bg:#DBEAFE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 18px;position:sticky;top:0;z-index:10;flex-wrap:wrap;}
  .topbar h1{font-size:17px;font-weight:600;margin:0;}
  .spacer{flex:1;}
  .topbar select{background:#254A6E;color:#fff;border:1px solid #375F87;border-radius:6px;padding:6px 10px;font-size:13px;}
  .bell{position:relative;font-size:18px;cursor:default;padding:4px 8px;}
  .bell .count{position:absolute;top:-2px;right:0;background:#DC2626;color:#fff;font-size:10px;border-radius:8px;padding:1px 5px;}
  .layout{display:flex;min-height:calc(100vh - 52px);}
  .sidebar{width:250px;background:#fff;border-right:1px solid var(--border);padding:14px 0;flex-shrink:0;}
  .sidebar .grp{padding:8px 18px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mute);font-weight:700;margin-top:10px;}
  .navitem{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 18px;font-size:14px;color:var(--text);cursor:pointer;border-left:3px solid transparent;}
  .navitem:hover{background:#F0F3F6;}
  .navitem.active{background:#EAF1F7;border-left-color:var(--navy);font-weight:600;color:var(--navy);}
  .content{flex:1;padding:26px 32px;max-width:980px;}
  .content h2{font-size:22px;margin:0 0 4px;color:var(--navy);}
  .subtitle{color:var(--text-mute);font-size:13.5px;margin:0 0 20px;max-width:760px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .card h3{font-size:14px;margin:0 0 10px;}
  .item{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px;}
  .item b{font-size:13.5px;}
  .muted{color:var(--text-mute);font-size:12.5px;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:13.5px;}
  th{background:#F0F3F6;text-align:left;padding:9px 12px;font-size:12px;text-transform:uppercase;color:var(--text-mute);letter-spacing:.03em;}
  td{padding:9px 12px;border-top:1px solid var(--border);}
  .chip{display:inline-block;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:600;}
  .chip-default{background:#EEF1F4;color:#374151;}
  .chip-primary{background:var(--blue-bg);color:var(--blue);}
  .chip-success{background:var(--green-bg);color:var(--green);}
  .chip-warning{background:var(--amber-bg);color:var(--amber);}
  .chip-error{background:var(--red-bg);color:var(--red);}
  .party-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fff;}
  .filterchip{display:inline-block;padding:5px 12px;border-radius:16px;border:1px solid var(--border);font-size:12.5px;margin:0 6px 6px 0;cursor:pointer;background:#fff;}
  .filterchip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .thread-list button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:13px;}
  .thread-list button.active{border-color:var(--navy);background:#EAF1F7;}
  .msg{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff;}
  .alert{border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:13.5px;}
  .alert-error{background:var(--red-bg);color:var(--red);border:1px solid #FCA5A5;}
  .alert-info{background:var(--blue-bg);color:var(--blue);border:1px solid #93C5FD;}
  .disabled-btn{background:#D1D5DB;color:#6B7280;border:none;padding:9px 16px;border-radius:6px;font-size:13.5px;cursor:not-allowed;margin-bottom:16px;}
  .formbox{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:18px;}
  .formbox h3{font-size:14px;margin:0 0 10px;color:var(--navy);}
  .formbox label{display:block;font-size:12px;color:var(--text-mute);margin-bottom:3px;}
  .formbox input[type=text],.formbox input[type=number],.formbox select,.formbox textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;margin-bottom:10px;font-family:inherit;}
  .formbox textarea{resize:vertical;min-height:60px;}
  .btn-sm{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-sm.outline{background:#fff;color:var(--navy);border:1px solid var(--navy);}
  .btn-sm.teal{background:var(--teal);}
  .err-text{color:var(--red);font-size:12px;margin:-4px 0 8px;}
  .inline-actions{display:flex;gap:8px;margin-top:6px;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:#F5F8FB;}
  .backlink{background:none;border:none;color:var(--navy);font-size:13px;cursor:pointer;padding:0;margin-bottom:14px;font-weight:600;}
  .backlink:hover{text-decoration:underline;}
  .detailbox{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .detailbox dl{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;margin:0 0 16px;}
  .detailbox dt{color:var(--text-mute);font-size:12.5px;}
  .detailbox dd{margin:0;font-size:13.5px;}
  /* ===== Dashboard "what's required of you" hero + nav badges — added per direct user request: as an end user
     (e.g. Plaintiff), the app wasn't visually telling them what's owed of them. ===== */
  .navitem{position:relative;}
  .nav-badge{display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 5px;margin-left:6px;vertical-align:1px;}
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px;}
  .hero-tile{border-radius:12px;padding:16px 18px;color:#fff;}
  .hero-tile .hero-num{font-size:30px;font-weight:800;line-height:1;margin-bottom:4px;}
  .hero-tile .hero-label{font-size:12.5px;font-weight:600;opacity:.95;}
  .hero-tile .hero-sub{font-size:11.5px;opacity:.85;margin-top:2px;}
  .hero-tile.urgent{background:linear-gradient(135deg,#B91C1C,#DC2626);}
  .hero-tile.action{background:linear-gradient(135deg,#B45309,#D97706);}
  .hero-tile.info{background:linear-gradient(135deg,#1E40AF,#2563EB);}
  .hero-tile.calm{background:linear-gradient(135deg,#166534,#16A34A);}
  .hero-banner{background:#fff;border:1px solid var(--border);border-left:4px solid var(--green);border-radius:10px;padding:14px 18px;margin-bottom:20px;font-size:14px;color:var(--green);font-weight:600;}
  .hero-banner.needs-action{border-left-color:var(--amber);color:var(--amber);}
</style>
</head>
<body>

<div class="topbar">
  <h1>Court Application — Prototype</h1>
  <div class="spacer"></div>
  <label style="font-size:12px;">Matter
    <select id="matterSelect" onchange="onMatterChange(this.value)"></select>
  </label>
  <label style="font-size:12px;">Viewing as
    <select id="roleSelect" onchange="onRoleChange(this.value)">
      <option>Plaintiff</option><option>Defendant</option><option>Lawyer</option>
      <option>Expert</option><option>Witness</option><option>CourtAdmin</option>
    </select>
  </label>
  <div class="bell">🔔<span class="count" id="notifCount">0</span></div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

<!-- Map Picker overlay — added this round so location fields are chosen from a map, never free-typed. Lives outside
     #content (not touched by render()) so opening it never wipes whatever else the user is mid-typing in the form. -->
<div id="mapPickerOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:50;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:10px;max-width:520px;width:92%;max-height:85vh;overflow:auto;padding:16px 18px;">
    <h3 style="margin:0 0 4px;color:var(--navy);font-size:16px;">Choose a Location</h3>
    <p class="muted" style="margin:0 0 10px;font-size:12.5px;">Select a known address on this Matter, or use your current location — captured automatically, not typed.</p>
    <div id="mapPickerFrameWrap" style="border:1px solid #E1E5EA;border-radius:8px;overflow:hidden;margin-bottom:10px;height:220px;"></div>
    <button class="btn-sm teal" style="margin-bottom:10px;width:100%;" onclick="useCurrentLocationSim()">📍 Use Current Location (simulated GPS)</button>
    <div id="mapPickerQuickList"></div>
    <button class="btn-sm outline" style="margin-top:8px;" onclick="closeMapPicker()">Cancel</button>
  </div>
</div>

// Generates a small, clearly-labeled SVG "document" as a data URL — used only so pre-seeded example rows have a real,
// openable attachment (no broken/decorative "📎" text). A file picked through the real <input type="file"> below is
// read via FileReader instead and opens the actual chosen file, not a mock.
function mockDocDataUrl(titleLine, subLines){
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = (subLines||[]).map(esc);
  const h = 90 + lines.length*24;
  const rows = lines.map((l,i)=>`<text x="20" y="${74+i*24}" font-family="Arial, sans-serif" font-size="14" fill="#1F2937">${l}</text>`).join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="440" height="${h}">
    <rect width="100%" height="100%" fill="#ffffff" stroke="#E1E5EA" stroke-width="2"/>
    <rect x="0" y="0" width="100%" height="36" fill="#1B3A5C"/>
    <text x="16" y="24" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">📎 ${esc(titleLine)}</text>
    <text x="16" y="56" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Illustrative attachment — generated for this prototype</text>
    ${rows}
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
(function attachMockDocuments(){
  Object.keys(DATA.expenses).forEach(mid=>{
    (DATA.expenses[mid]||[]).forEach(e=>{
      if(e.receipt && !e.fileData){
        e.fileData = mockDocDataUrl('Receipt', [e.desc, '$'+e.amount.toFixed(2), e.date]);
        e.fileName = 'receipt.svg';
      }
    });
  });
  // One seeded submission (the Witness Statement) is left without an attachment on purpose, to show attaching a
  // document is genuinely optional, not required.
  Object.keys(DATA.submissions).forEach(mid=>{
    (DATA.submissions[mid]||[]).forEach(s=>{
      if(s.kind !== 'Witness Statement' && !s.fileData){
        s.fileData = mockDocDataUrl(s.kind, [s.title, s.date]);
        s.fileName = s.title.replace(/[^a-z0-9]+/gi,'_') + '.svg';
      }
    });
  });
})();

const COURT_FEE_SCHEDULE = {
  Motion: {court:45.00, service:15.00, total:60.00},

// Charges the court fee for a just-filed Legal Document to whichever party it was filed for — pattern mirrors the
// original seeded Motion example exactly (card pre-authorized on filing, charged by "Court System (automatic)").
// If that party has no payment method on file, the charge is recorded as Pending rather than silently faked as Paid.
function chargeCourtFee(docType, title, filedForName){
  const fee = COURT_FEE_SCHEDULE[docType];
  if(!fee || fee.total<=0) return;
  const methods = DATA.paymentMethods[state.matterId]||[];
  const payerMethod = methods.find(m=>m.party===filedForName);
  const filedForParty = matter().parties.find(p=>p.name===filedForName);
  const status = payerMethod ? 'Paid' : 'Pending';
  const methodLabel = payerMethod ? `${payerMethod.brand} •••• ${payerMethod.last4}` : 'No payment method on file';
  (DATA.payments[state.matterId]=DATA.payments[state.matterId]||[]).unshift({
    kind:'Court Fee', desc:`${title} — court filing fee`, relatedTitle:title,
    breakdown:`Court filing fee $${fee.court.toFixed(2)} + platform service fee $${fee.service.toFixed(2)}`,
    amount:fee.total, currency:'$',
    party: filedForName + (filedForParty?` (${filedForParty.role})`:''),
    filedBy: `${currentPartyName()} (Lawyer${filedForParty?`, on behalf of ${filedForParty.role}`:''})`,
    chargedBy: status==='Paid' ? 'Court System (auto, on filing acceptance)' : 'Court System (pending — no payment method on file for this party)',
    method: methodLabel, status, date:'just now',
    feeLines:[
      {label:'Court Filing Fee (paid to the court)', amount:fee.court},
      {label:'Platform Service Fee (charged by this app for filing this request)', amount:fee.service}
    ],
    steps:[
      {label:`Document filed by lawyer — card ${status==='Paid'?'pre-authorized':'NOT available'} for $${fee.total.toFixed(2)}`, who:`${currentPartyName()}${filedForParty?` (on behalf of ${filedForName} / ${filedForParty.role})`:''}`, ts:'just now'}
    ]
  });
  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Payments", actor:currentPartyName(), action:`Court fee ${status==='Paid'?'captured':'recorded as pending — no card on file'}: $${fee.total.toFixed(2)} for filing "${title}"`});
}

function chip(text,cls){ return `<span class="chip chip-${cls||'default'}">${text}</span>`; }
// fmtDT/fmtDate — format real <input type=datetime-local>/<input type=date> values into a readable display string.
// Added this round: date/time fields across the app were free-typed text ("tomorrow 17:00") — now real pickers,
// so their raw ISO value is reformatted for display rather than shown as "2026-09-05T17:00".
function fmtDT(v){
  if(!v) return v;
  const d = new Date(v);
  if(isNaN(d.getTime())) return v;
  return d.toLocaleString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});
}
function fmtDate(v){
  if(!v) return v;
  const d = new Date(v+'T00:00:00');
  if(isNaN(d.getTime())) return v;
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
// DEMO_TODAY — fixed reference "today" for due-date/installment math, so the demo reads consistently regardless
// of the real date the viewer opens the prototype on (matches this round's actual delivery date).
const DEMO_TODAY = new Date('2026-08-29T09:00:00');
function daysBetween(isoDate){
  if(!isoDate) return null;
  const d = new Date(isoDate+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return Math.round((d - new Date(DEMO_TODAY.toDateString())) / 86400000);
}
function dueLabel(isoDate){
  const n = daysBetween(isoDate);
  if(n===null) return isoDate || '—';
  if(n===0) return `${fmtDate(isoDate)} (due today)`;
  if(n<0) return `${fmtDate(isoDate)} (${Math.abs(n)} day${Math.abs(n)===1?'':'s'} overdue)`;
  return `${fmtDate(isoDate)} (in ${n} day${n===1?'':'s'})`;
}
function addMonths(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}
// Installment Plan — evidenced directly by Ahmed Kareem's own example (partners' debt dispute, paid $5k/month) and
// mirrored in the seeded Interim Payment Plan Agreement (Agreements) + the pending "installment #4 of 20" Payment
// Request already on MAT-0002. Built as a real 20-row schedule (not just one narrative row) so remaining-count and
// due-soon logic have real dates to compute against, anchored to DEMO_TODAY so the demo reads consistently.
// payerRole: Cascade Logistics Co. (Defendant) is the one who owes payment to Meridian Freight LLC (Plaintiff) per
// the agreement text — matches the oppositeRole()-owner convention already used everywhere else in this app.
(function buildInstallmentPlans(){
  DATA.installmentPlans = {};
  const plan = { title:"Interim Payment Plan Agreement", totalAmount:100000.00, installmentAmount:5000.00, totalInstallments:20, startDate:"2026-06-01", payerRole:"Defendant" };
  plan.installments = [];
  for(let n=0;n<plan.totalInstallments;n++){
    const due = addMonths(plan.startDate, n);
    plan.installments.push({ number:n+1, dueDate:due, status: daysBetween(due)<0 ? 'Paid' : 'Upcoming' });
  }
  (DATA.installmentPlans["MAT-0002"] = DATA.installmentPlans["MAT-0002"]||[]).push(plan);
})();
function installmentPlansHtml(){
  const plans = DATA.installmentPlans[state.matterId]||[];
  if(!plans.length) return '';
  return plans.map(plan=>{
    const paid = plan.installments.filter(x=>x.status==='Paid').length;
    const remaining = plan.totalInstallments - paid;
    const next = plan.installments.find(x=>x.status!=='Paid');
    return `<h3 style="font-size:14px;color:var(--navy);margin-top:20px;">Installment Plan — ${plan.title}</h3>
    <p class="subtitle" style="margin-top:-4px;">Real payment schedule generated from the agreement's terms — remaining-installment count and due-soon status are computed live, not hand-typed.</p>
    <div class="card" style="margin-bottom:12px;">
      <div class="item"><b>$${plan.installmentAmount.toFixed(2)}/month</b> · Total $${plan.totalAmount.toFixed(2)} over ${plan.totalInstallments} installments
        <div class="muted" style="margin-top:4px;">${paid} of ${plan.totalInstallments} paid · <b>${remaining} installment${remaining===1?'':'s'} remaining</b>${next?` · Next due: ${dueLabel(next.dueDate)} (owed by ${plan.payerRole})`:' · Fully paid'}</div>
      </div>
    </div>
    <table><tr><th>#</th><th>Due Date</th><th>Amount</th><th>Status</th></tr>
    ${plan.installments.map(x=>{const dd=daysBetween(x.dueDate); const dueSoon = x.status!=='Paid' && dd!==null && dd<=7; return `<tr><td>${x.number}</td><td>${fmtDate(x.dueDate)}</td><td>$${plan.installmentAmount.toFixed(2)}</td><td>${chip(dueSoon?'Due Soon':x.status, x.status==='Paid'?'success':dueSoon?'warning':'default')}</td></tr>`;}).join('')}
    </table>`;
  }).join('');
}
// Live installment due-date notifications — computed fresh on every render (not a stale seeded notification) so
// switching Matter/role always reflects the real current schedule state relative to DEMO_TODAY.
function computeInstallmentNotifications(){
  const notes = [];
  const plans = DATA.installmentPlans[state.matterId]||[];
  plans.forEach(plan=>{
    const paid = plan.installments.filter(x=>x.status==='Paid').length;
    const remaining = plan.totalInstallments - paid;
    const next = plan.installments.find(x=>x.status!=='Paid');
    if(!next) return;
    const n = daysBetween(next.dueDate);
    if(n!==null && n<=7){
      notes.push({ title:`Installment ${next.number} of ${plan.totalInstallments} due — ${dueLabel(next.dueDate)}. ${remaining} installment${remaining===1?'':'s'} remaining.`, owner:plan.payerRole, due:dueLabel(next.dueDate) });
    }
  });
  return notes;
}
// Matter type — explicit field (Family/Commercial/PersonalInjury/CriminalDefense/Immigration), see DATA.matters
// comment above for why. isFamilyMatter() kept as a thin wrapper (minimal diff for existing callers).
function matterType(){ return matter().type; }
function isFamilyMatter(){ return matterType()==='Family'; }
function allowed(page){
  if(!ROLE_PAGES[state.role].includes(page)) return false;
  const mt = matterType();
  if((page==='notes' || page==='activities' || page==='journal') && mt!=='Family') return false;
  // Consents' predefined dropdown (Travel/Doctor/School) is family-specific — already a known flagged gap on the
  // Commercial matter from an earlier round (not silently invented a fix for); not spreading that same mismatch to
  // the 3 new matter types this round, so Consents stays Family+Commercial only.
  if(page==='consents' && mt!=='Family' && mt!=='Commercial') return false;
  // Messaging shows ONE shared thread to every party with matter access — correct for Family/Commercial/PersonalInjury
  // (civil, two-sided, nothing privileged), but WRONG for CriminalDefense/Immigration where Defendant-Lawyer or
  // Petitioner-Lawyer communication needs real privacy/privilege separation this simple shared-thread model doesn't
  // provide. Gated off rather than silently exposing privileged communication.
  if(page==='messaging' && !['Family','Commercial','PersonalInjury'].includes(mt)) return false;
  if(page==='medicalSettlement' && mt!=='PersonalInjury') return false;
  if(page==='chargesCourtDates' && mt!=='CriminalDefense') return false;
  if(page==='immigrationFilings' && mt!=='Immigration') return false;
  if(page==='negotiation' && mt!=='Commercial') return false;
  return true;
}

// ToneMeter — lightweight flagged-language check, run client-side as the user types. Pattern benchmarked from
// OurFamilyWizard's ToneMeter (Messages + Journal composers). Never blocks sending — advisory only.
const TONE_FLAG_WORDS = ["stupid","hate","idiot","never","always","ridiculous","pathetic","liar","lazy","worthless","shut up","screw you"];
function toneCheckHits(text){
  const lower = (text||'').toLowerCase();
  return TONE_FLAG_WORDS.filter(w=>lower.includes(w));
}
function updateToneMeter(inputId, outId){
  const el = document.getElementById(inputId);
  const out = document.getElementById(outId);
  if(!el || !out) return;
  const hits = toneCheckHits(el.value);
  out.innerHTML = hits.length
    ? `<div class="alert alert-error" style="padding:6px 10px;font-size:12px;margin:-2px 0 8px;">🔴 ToneMeter: this may read as emotionally charged — flagged: "${hits.join('", "')}". You can still send, but consider rephrasing.</div>`
    : (el.value.trim() ? `<div class="muted" style="font-size:11.5px;margin:-2px 0 8px;">🟢 ToneMeter — tone looks fine.</div>` : '');
}

// Approve/Reject + reason — added this round: pending items only linked back to their source module with no direct
// decision surface, and decisions never captured a reason. `actionModal` tracks which item is being decided; the
// reason is required to reject, optional to approve, and is stored on the record + written to the audit log.
const ACTIONABLE_PENDING_KINDS = ['consent','schedule','expense','negotiation','paymentRequest'];
let actionModal = null; // {kind, idx, decision}
function openActionModal(kind, idx, decision){ actionModal = {kind, idx, decision}; render(); }
function cancelActionModal(){ actionModal = null; render(); }
function confirmActionModal(){
  if(!actionModal) return;
  const {kind, idx, decision} = actionModal;
  const reasonEl = document.getElementById('actionReason');
  const errEl = document.getElementById('actionReasonErr');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  if(decision==='reject' && !reason){ if(errEl) errEl.textContent = "Enter a reason before rejecting."; return; }
  actionModal = null;
  if(kind==='consent') decideConsent(idx, decision==='approve', reason);
  else if(kind==='schedule') decideScheduleChange(idx, decision==='approve', reason);
  else if(kind==='expense') decideExpenseReimbursement(idx, decision==='approve', reason);
  else if(kind==='negotiation'){ if(decision==='approve') startSigning(idx); else decideOffer(idx, 'Rejected', reason); }
  else if(kind==='paymentRequest'){ if(decision==='approve') payPaymentRequest(idx); else declinePaymentRequest(idx, reason); }
}
function actionModalHtml(kind, idx){
  if(!actionModal || actionModal.kind!==kind || actionModal.idx!==idx) return '';
  const isReject = actionModal.decision==='reject';
  return `<div class="formbox" onclick="event.stopPropagation()" style="margin:8px 0 0;padding:10px 12px;border-color:${isReject?'var(--red)':'var(--teal)'};">
    <label>${isReject ? 'Reason for rejecting (required)' : 'Reason / note (optional)'}</label>
    <textarea id="actionReason" placeholder="${isReject?'Explain why you are rejecting this...':'Add an optional note...'}"></textarea>
    <div class="err-text" id="actionReasonErr"></div>
    <div class="inline-actions"><button class="btn-sm" onclick="confirmActionModal()">${isReject?'Confirm Reject':'Confirm'}</button><button class="btn-sm outline" onclick="cancelActionModal()">Cancel</button></div>
  </div>`;
}

// Nav badge counts — surfaces "what's required of you" right in the sidebar, not just buried inside each page.
// Only counts items actually owned by / addressed to the current role, so it never over-alarms someone who has
// nothing to do.
function navBadgeCounts(){
  const pend = allowed('pending') ? computeLivePending().filter(p=>p.owner===state.role).length : 0;
  const msgs = allowed('messaging') ? (DATA.messages[state.matterId]||[]).filter(t=>{const last=t.msgs[t.msgs.length-1]; return last && !last.viewed;}).length : 0;
  const notif = allowed('notifications') ? (DATA.notifications[state.matterId]||[]).filter(n=>!n.read && (!n.forRole || n.forRole===state.role)).length + computeInstallmentNotifications().filter(n=>!n.owner || n.owner===state.role).length : 0;
  return {pending:pend, messaging:msgs, notifications:notif};
}
function renderSidebar(){
  let html = "";
  const famMatter = isFamilyMatter();
  const badges = navBadgeCounts();
  NAV.forEach(g=>{
    const items = g.items.filter(([key])=>allowed(key));
    if(!items.length) return;
    if(g.sec) html += `<div class="grp">${g.sec}</div>`;
    items.forEach(([key,label])=>{
      const shownLabel = (key==='family' && !famMatter) ? 'Party & Case Info' : label;
      const count = badges[key] || 0;
      const badge = count>0 ? `<span class="nav-badge">${count}</span>` : '';
      html += `<button class="navitem ${state.page===key?'active':''}" onclick="goPage('${key}')">${shownLabel}${badge}</button>`;
    });
  });
  document.getElementById('sidebar').innerHTML = html;
}

// "What's required of you" hero — added per direct user feedback: as a logged-in end user (e.g. Plaintiff), the
// old dashboard listed items but never gave a strong, at-a-glance visual signal of what's actually owed of them.
// Built from the SAME live data computeLivePending()/unread-messages already compute — no new fake counters.
function dashboardHero(pend, unreadMsgs){
  const myActions = pend.filter(p=>p.owner===state.role);
  const overdue = myActions.filter(p=>/overdue/.test(p.due));
  const cal = (DATA.calendar[state.matterId]||[]);
  const soon = cal.filter(e=>{ const n=daysBetween((e.start||'').slice(0,10)); return n!==null && n>=0 && n<=7; }).length;

  if(myActions.length===0 && unreadMsgs.length===0 && overdue.length===0){
    return `<div class="hero-banner">✅ You're all caught up on this Matter — nothing needs your action right now.</div>`;
  }
  const tiles = [];
  if(overdue.length) tiles.push(`<div class="hero-tile urgent"><div class="hero-num">${overdue.length}</div><div class="hero-label">Overdue — Act Now</div><div class="hero-sub">Past their due date</div></div>`);
  tiles.push(`<div class="hero-tile action"><div class="hero-num">${myActions.length}</div><div class="hero-label">Needs Your Action</div><div class="hero-sub">Approvals, payments & requests waiting on you</div></div>`);
  if(unreadMsgs.length) tiles.push(`<div class="hero-tile info"><div class="hero-num">${unreadMsgs.length}</div><div class="hero-label">Unread Messages</div><div class="hero-sub">In Messaging</div></div>`);
  if(soon) tiles.push(`<div class="hero-tile calm"><div class="hero-num">${soon}</div><div class="hero-label">Coming Up (7 days)</div><div class="hero-sub">Calendar events</div></div>`);
  return `<div class="hero">${tiles.join('')}</div>`;
}

function createMatter(){
  const title = document.getElementById('newMatTitle').value.trim();
  const type = document.getElementById('newMatType').value;
  const caseNumber = document.getElementById('newMatCaseNum').value.trim();
  const court = document.getElementById('newMatCourt').value.trim();
  const plaintiffName = document.getElementById('newMatPlaintiff').value.trim();
  const plaintiffContact = document.getElementById('newMatPlaintiffContact').value.trim();
  const defendantName = document.getElementById('newMatDefendant').value.trim();
  const defendantContact = document.getElementById('newMatDefendantContact').value.trim();
  const errEl = document.getElementById('newMatErr');
  if(!title || !caseNumber || !court || !plaintiffName){ errEl.textContent = "Enter at least a title, case number, court/jurisdiction, and the primary party's name."; return; }
  errEl.textContent = "";
  const nums = DATA.matters.map(m=>parseInt(m.id.split('-')[1],10)).filter(n=>!isNaN(n));
  const id = 'MAT-' + String((nums.length?Math.max(...nums):0)+1).padStart(4,'0');
  const parties = [{name:plaintiffName, role:'Plaintiff', contact: plaintiffContact || '—'}];
  if(defendantName) parties.push({name:defendantName, role:'Defendant', contact: defendantContact || '—'});
  DATA.matters.push({ id, type, title, caseNumber, court, status:'Active', opened:'today', parties });
  DATA.infoBank[id]=[]; DATA.agreements[id]=[]; DATA.activities[id]=[]; DATA.calendar[id]=[]; DATA.scheduleRequests[id]=[];
  DATA.messages[id]=[]; DATA.notes[id]=[]; DATA.journal[id]=[]; DATA.expenses[id]=[]; DATA.consents[id]=[]; DATA.notices[id]=[];
  DATA.audit[id]=[{ts:"just now", module:"System", actor:currentPartyName(), action:`Matter created: ${title}`}];
  DATA.notifications[id]=[]; DATA.submissions[id]=[]; DATA.paymentMethods[id]=[]; DATA.payments[id]=[];
  DATA.negotiation[id]=[]; DATA.paymentRequests[id]=[];
  state.matterId = id;
  state.page = 'dashboard';
  state.detail = {page:null, idx:null};
  render();
}
function addStakeholder(){

function createCalendarEvent(){

function requestScheduleChange(){
  const eventTitle = document.getElementById('chgEvent').value;
  const newStart = document.getElementById('chgStart').value;

  errEl.textContent = "";
  (DATA.scheduleRequests[state.matterId]=DATA.scheduleRequests[state.matterId]||[]).unshift({eventTitle, requestedBy:currentPartyName(), newStart:fmtDT(newStart), newEnd:fmtDT(newEnd||newStart), reason, status:'Pending', date:'just now'});
  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Calendar", actor:currentPartyName(), action:`Requested schedule change: ${eventTitle} → ${newStart}`});

function decideScheduleChange(i, approve, reason){
  const rows = DATA.scheduleRequests[state.matterId]||[];
  const r = rows[i];
  if(!r) return;
  r.status = approve ? 'Approved' : 'Declined';
  r.decisionReason = reason || null;
  if(approve){
    const events = DATA.calendar[state.matterId]||[];
    const ev = events.find(e=>e.title===r.eventTitle);
    if(ev){ ev.start = r.newStart; ev.end = r.newEnd; }
  }
  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Calendar", actor:currentPartyName(), action:`${approve?'Approved':'Refused'} schedule change: ${r.eventTitle}${reason?` — reason: ${reason}`:''}`});
  render();
}

function submitPaymentRequest(){
  const amt = parseFloat(document.getElementById('prAmt').value);
  const reason = document.getElementById('prReason').value.trim();
  const due = document.getElementById('prDue').value;
  const errEl = document.getElementById('prErr');
  if(isNaN(amt) || amt<=0 || !reason){ errEl.textContent = "Enter a valid amount and reason before requesting."; return; }
  errEl.textContent = "";
  (DATA.paymentRequests[state.matterId]=DATA.paymentRequests[state.matterId]||[]).unshift({by:currentPartyName(), amount:amt, reason, dueDate: due||'—', date:'just now', status:'Pending'});
  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Payments", actor:currentPartyName(), action:`Requested payment: $${amt.toFixed(2)} — ${reason}`});
  (DATA.notifications[state.matterId]=DATA.notifications[state.matterId]||[]).unshift({ts:"just now", title:`Payment requested: $${amt.toFixed(2)} — ${reason}`, read:false, module:"Payments", forRole:null});

function declinePaymentRequest(i, reason){
  const rows = DATA.paymentRequests[state.matterId]||[];

  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Payments", actor:currentPartyName(), action:`Declined payment request: $${r.amount.toFixed(2)} — ${r.reason}${reason?` (reason: ${reason})`:''}`});

function payPaymentRequest(i){
  const rows = DATA.paymentRequests[state.matterId]||[];
  const r = rows[i];
  if(!r) return;
  const methods = DATA.paymentMethods[state.matterId]||[];
  const mine = methods.find(m=>m.party===currentPartyName());
  if(!mine) return;
  const methodLabel = `${mine.brand} •••• ${mine.last4}`;
  r.status = 'Paid';
  // Processing/transfer fee and platform commission kept as separate illustrative line items per the client's
  // request — never blended into the requested amount itself. Processing fee is added on top of what the payer
  // sends; commission is shown as deducted from the payee's side (never double-charged to the payer).
  const processingFee = +(r.amount * 0.029 + 0.30).toFixed(2);
  const platformCommission = +(r.amount * 0.01).toFixed(2);
  (DATA.payments[state.matterId]=DATA.payments[state.matterId]||[]).unshift({kind:'Requested Payment', desc:r.reason, amount:r.amount, currency:'$', party:currentPartyName(), chargedBy:`Paid in response to a request from ${r.by}`, method:methodLabel, status:'Paid', date:'just now',
    breakdown:`Amount to payee: $${r.amount.toFixed(2)} + processing/transfer fee $${processingFee.toFixed(2)} (illustrative) — platform commission $${platformCommission.toFixed(2)} deducted from payee's side (illustrative)`,
    feeLines:[
      {label:'Amount Requested (to payee)', amount:r.amount},
      {label:'Payment Processing / Transfer Fee (illustrative, charged to payer)', amount:processingFee},
      {label:"Platform Commission — deducted from payee's side (illustrative)", amount:-platformCommission}
    ]});
  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Payments", actor:currentPartyName(), action:`Paid requested payment: $${r.amount.toFixed(2)} — ${r.reason} (requested by ${r.by})`});
  render();
}

// Real, working export — a Blob + temporary download link (functions in an actual browser, unlike the previous
// disabled placeholder button).
function downloadCSV(filename, rows, headers){
  const esc = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc).join(',')].concat(rows.map(r=>headers.map(h=>esc(r[h])).join(',')));
  const csv = lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportDocumentsCSV(){
  const rows = documentRowsForRole().map(r=>({Source:r.source, Title:r.title, By:r.by, Date:r.date, FileName:r.fileName||''}));
  downloadCSV(`documents_${state.matterId}.csv`, rows, ['Source','Title','By','Date','FileName']);
}

const CERTIFIED_EXPORT_FEE = 15.00;
let certExportRequest = null; // {kind:'messaging'|'documents', ref}
function openCertifiedExport(kind, ref){ certExportRequest = {kind, ref: String(ref)}; render(); }
function cancelCertifiedExport(){ certExportRequest = null; render(); }
function certifiedExportHtml(kind, ref){
  if(!certExportRequest || certExportRequest.kind!==kind || certExportRequest.ref!==String(ref)) return '';
  const methods = DATA.paymentMethods[state.matterId]||[];
  const mine = methods.find(m=>m.party===currentPartyName());
  return `<div class="formbox" onclick="event.stopPropagation()" style="margin-top:8px;border-color:var(--amber);">
    <p style="margin:0 0 8px;font-size:12.5px;">This creates a certified, court-admissible export — suitable to submit as evidence. <b>Fee: $${CERTIFIED_EXPORT_FEE.toFixed(2)}</b> (Certified Export Fee, charged by this app). Downloading your own records for your own use stays free.</p>
    ${mine ? `<button class="btn-sm" onclick="confirmCertifiedExport('${kind}','${ref}')">Pay $${CERTIFIED_EXPORT_FEE.toFixed(2)} & Download</button>` : `<div class="muted" style="margin-bottom:8px;">Add a payment method on Payment Methods & Charges first.</div>`}
    <button class="btn-sm outline" onclick="cancelCertifiedExport()">Cancel</button>
  </div>`;
}
function confirmCertifiedExport(kind, ref){
  const methods = DATA.paymentMethods[state.matterId]||[];
  const mine = methods.find(m=>m.party===currentPartyName());
  if(!mine) return;
  const methodLabel = `${mine.brand} •••• ${mine.last4}`;
  let desc, rows, headers, filename;
  if(kind==='messaging'){
    const threads = DATA.messages[state.matterId]||[];
    const t = threads[Number(ref)];
    desc = `Certified Transcript — ${t ? t.subject : 'Messaging Thread'}`;
    rows = (t?t.msgs:[]).map(m=>({From:m.from, Sent:m.sent, Viewed:m.viewed||'Not yet viewed', Message:m.body}));
    headers = ['From','Sent','Viewed','Message'];
    filename = `certified_transcript_${state.matterId}.csv`;
  } else {
    desc = 'Certified Documents Export';
    rows = documentRowsForRole().map(r=>({Source:r.source, Title:r.title, By:r.by, Date:r.date, FileName:r.fileName||''}));
    headers = ['Source','Title','By','Date','FileName'];
    filename = `certified_documents_${state.matterId}.csv`;
  }
  (DATA.payments[state.matterId]=DATA.payments[state.matterId]||[]).unshift({
    kind:'Certified Export Fee', desc, amount:CERTIFIED_EXPORT_FEE, currency:'$', party:currentPartyName(),
    chargedBy:'This app (certified export for court submission)', method:methodLabel, status:'Paid', date:'just now',
    feeLines:[{label:'Certified Export Fee (this app — court-admissible export)', amount:CERTIFIED_EXPORT_FEE}]
  });
  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Payments", actor:currentPartyName(), action:`Paid Certified Export Fee ($${CERTIFIED_EXPORT_FEE.toFixed(2)}) and downloaded: ${desc}`});
  downloadCSV(filename, rows, headers);
  certExportRequest = null;
  render();
}

function pageNotifications(){
  const rows = (DATA.notifications[state.matterId]||[]).filter(n=>!n.forRole || n.forRole===state.role);
  const liveInstallments = computeInstallmentNotifications().filter(n=>!n.owner || n.owner===state.role);
  return `<h2>Notification Center</h2>
  <p class="subtitle">Notifications relevant to you as <b>${state.role}</b>.</p>
  ${liveInstallments.map(n=>`<div class="item">🔔 <b>${n.title}</b><div class="muted">Installment Plan · computed live</div></div>`).join('')}
  ${rows.map(n=>`<div class="item">${n.read?'✓':'●'} <b>${n.title}</b><div class="muted">${n.module} · ${n.ts}${n.forRole?` · For ${n.forRole}`:''}</div></div>`).join('') || (liveInstallments.length? '' : '<div class="muted">No notifications for your role right now.</div>')}`;
}

// Selective document visibility — evidenced directly by Ahmed Kareem's own words: documents an expert files may only
// be partly shareable, and "the other side's lawyer — it's up to you which of them he sees and which he doesn't"
// ("حضرتك هتختار مين اللي يشوف مين اللي ما يشوفش"), sharpened by the user's own follow-up: real per-person
// CUSTOMIZATION, not just a few fixed tiers. The submitter checks off exactly which OTHER roles can see a
// submission (their own role and CourtAdmin always can, non-negotiable — court oversight). A role that isn't
// checked simply doesn't see the row (matches Kareem's literal show/hide framing, not a "visible-but-redacted"
// placeholder). Missing/legacy `visibleRoles` (anything seeded before this feature existed) defaults to nobody
// extra — own role + CourtAdmin only, the ORIGINAL pre-this-round behavior — so nothing already seeded silently
// becomes more visible than it was before this feature shipped.
const ALL_VIS_ROLES = ['Plaintiff','Defendant','Lawyer','Expert','Witness'];
function canSeeSubmission(s){
  if(state.role===s.role || state.role==='CourtAdmin') return true;
  return Array.isArray(s.visibleRoles) && s.visibleRoles.includes(state.role);
}
function pageSubmissions(){
  const all = DATA.submissions[state.matterId]||[];
  const rows = all.filter(canSeeSubmission);
  const st = s=> s==='Reviewed'?'success': s==='Submitted'?'warning':'default';

  if(state.detail.page==='submissions' && all[state.detail.idx] && canSeeSubmission(all[state.detail.idx])){
    const s = all[state.detail.idx];
    const i = state.detail.idx;
    return `<button class="backlink" onclick="closeDetail()">← Back to My Submissions</button>
    <h2>${s.title}</h2>
    <p class="subtitle">${s.kind} — visible to you as <b>${state.role}</b> on this Matter.</p>
    <div class="detailbox">
      <dl>
        <dt>Kind</dt><dd>${s.kind}${s.docType?` (${s.docType})`:''}</dd>
        ${state.role==='CourtAdmin'?`<dt>Submitted By</dt><dd>${s.role}</dd>`:''}
        ${s.filedFor?`<dt>Filed On Behalf Of</dt><dd>${s.filedFor}</dd>`:''}
        ${s.location?`<dt>Location</dt><dd>📍 ${s.location}</dd>`:''}
        <dt>Date</dt><dd>${s.date}</dd>
        <dt>Status</dt><dd>${chip(s.status,st(s.status))}</dd>
        <dt>Visible To</dt><dd>${s.role} (submitter) + CourtAdmin${(s.visibleRoles&&s.visibleRoles.length)?', ' + s.visibleRoles.join(', ') : ' only'}</dd>
      </dl>
      <h3 style="font-size:13.5px;margin:0 0 8px;color:var(--navy);">Content</h3>
      <p style="font-size:13.5px;line-height:1.6;">${s.body}</p>
      ${s.fileData?`<p><button class="btn-sm outline" onclick="window.open('${s.fileData}','_blank')">📎 Open ${s.fileName||'attachment'}</button></p>`:'<p class="muted">No document attached.</p>'}
      ${state.role==='CourtAdmin' && s.status!=='Reviewed' ? `<button class="btn-sm outline" onclick="markSubmissionReviewed(${i})">Mark reviewed</button>` : ''}
    </div>`;
  }

  let html = `<h2>My Submissions</h2>
  <p class="subtitle">Reports, statements and filings owed by your role, and their review status. Click a row to read the full content.</p>`;

  const visibilityPicker = `<label>Who else can see this submission? (you and Court Admin always can — check any others)</label>
      <div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin:2px 0 10px;">
        ${ALL_VIS_ROLES.filter(r=>r!==state.role).map(r=>`<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:400;color:var(--text);"><input type="checkbox" class="subVisRole" value="${r}" style="width:auto;margin:0;"> ${r}</label>`).join('')}
      </div>`;

  if(state.role==='Expert' && matterType()==='Commercial'){
    html += `<div class="formbox"><h3>Submit a Site Inspection Report as ${currentPartyName()}</h3>
      <label>Title</label><input type="text" id="subTitle" placeholder="e.g. ${ex('subTitleExpert')}">
      <label>Location</label>${locationPickerField('subLocation', true)}
      <div style="height:10px;"></div>
      <label>Report</label><textarea id="subBody" placeholder="Summarize what was inspected and observed..."></textarea>
      <label>Attach a supporting document (optional)</label><input type="file" id="subFile" accept="image/*,.pdf,.doc,.docx">
      ${visibilityPicker}
      <div class="err-text" id="subErr"></div>
      <button class="btn-sm" onclick="submitReport('Inspection Report')">Submit inspection report</button>
    </div>`;
  } else if(state.role==='Expert'){
    html += `<div class="formbox"><h3>Submit an Expert Report as ${currentPartyName()}</h3>
      <label>Title</label><input type="text" id="subTitle" placeholder="e.g. ${ex('subTitleExpert')}">
      <label>Report</label><textarea id="subBody" placeholder="Summarize your findings..."></textarea>
      <label>Attach a supporting document (optional)</label><input type="file" id="subFile" accept="image/*,.pdf,.doc,.docx">
      ${visibilityPicker}
      <div class="err-text" id="subErr"></div>
      <button class="btn-sm" onclick="submitReport('Expert Report')">Submit report</button>
    </div>`;
  } else if(state.role==='Witness'){
    html += `<div class="formbox"><h3>Submit a Witness Statement as ${currentPartyName()}</h3>
      <label>Title</label><input type="text" id="subTitle" placeholder="e.g. ${ex('subTitleWitness')}">
      <label>Statement</label><textarea id="subBody" placeholder="Describe what you witnessed..."></textarea>
      <label>Attach a supporting document (optional)</label><input type="file" id="subFile" accept="image/*,.pdf,.doc,.docx">
      ${visibilityPicker}
      <div class="err-text" id="subErr"></div>
      <button class="btn-sm" onclick="submitReport('Witness Statement')">Submit statement</button>
    </div>`;
  } else if(state.role==='Lawyer'){
    const partyOptions = matter().parties.filter(p=>['Plaintiff','Defendant'].includes(p.role));
    html += `<div class="formbox"><h3>File a Legal Document as ${currentPartyName()}</h3>
      <label>Document Type</label>
      <select id="subType" onchange="updateCourtFeeNote()"><option>Motion</option><option>Filing</option><option>Brief</option><option>Correspondence</option></select>
      <div class="muted" id="subFeeNote" style="margin:-4px 0 10px;">Estimated court fee upon filing: $${COURT_FEE_SCHEDULE.Motion.total.toFixed(2)} ($${COURT_FEE_SCHEDULE.Motion.court.toFixed(2)} court filing fee + $${COURT_FEE_SCHEDULE.Motion.service.toFixed(2)} platform service fee).</div>
      ${partyOptions.length ? `<label>Filed On Behalf Of</label>
      <select id="subFiledFor">${partyOptions.map(p=>`<option value="${p.name}">${p.name} (${p.role})</option>`).join('')}</select>` : ''}
      <label>Title</label><input type="text" id="subTitle" placeholder="e.g. ${ex('subTitleLawyer')}">
      <label>Summary</label><textarea id="subBody" placeholder="Brief summary of the filing..."></textarea>
      <label>Attach the document (optional)</label><input type="file" id="subFile" accept="image/*,.pdf,.doc,.docx">
      ${visibilityPicker}
      <div class="err-text" id="subErr"></div>
      <button class="btn-sm" onclick="submitReport('Legal Document')">File document</button>
    </div>`;
  }

  html += `<table><tr><th>Kind</th><th>Title</th>${state.role==='CourtAdmin'?'<th>Submitted By</th>':''}<th>Attachment</th><th>Date</th><th>Status</th>${state.role==='CourtAdmin'?'<th>Action</th>':''}</tr>
  ${rows.map((s)=>{const i=all.indexOf(s); return `<tr class="clickable" onclick="viewDetail('submissions',${i})"><td>${s.kind}</td><td>${s.title}</td>${state.role==='CourtAdmin'?`<td>${s.role}</td>`:''}<td>${s.fileData?`<button class="btn-sm outline" onclick="event.stopPropagation();window.open('${s.fileData}','_blank')">📎 ${s.fileName||'View'}</button>`:'<span class="muted">—</span>'}</td><td>${s.date}</td><td>${chip(s.status,st(s.status))}</td>${state.role==='CourtAdmin'?`<td>${s.status!=='Reviewed'?`<button class="btn-sm outline" onclick="event.stopPropagation();markSubmissionReviewed(${i})">Mark reviewed</button>`:'<span class="muted">—</span>'}</td>`:''}</tr>`;}).join('') || `<tr><td colspan="${state.role==='CourtAdmin'?6:5}" class="muted">No submissions yet.</td></tr>`}
  </table>`;
  return html;
}
function submitReport(kind){
  const title = document.getElementById('subTitle').value.trim();
  const body = document.getElementById('subBody').value.trim();
  const locEl = document.getElementById('subLocation');
  const location = locEl ? locEl.value.trim() : '';
  const visibleRoles = Array.from(document.querySelectorAll('.subVisRole:checked')).map(el=>el.value);
  const errEl = document.getElementById('subErr');
  if(!title || !body){ errEl.textContent = "Add a title and content before submitting."; return; }
  errEl.textContent = "";
  const docTypeEl = document.getElementById('subType');
  const filedForEl = document.getElementById('subFiledFor');
  const docType = docTypeEl ? docTypeEl.value : null;
  const filedFor = filedForEl ? filedForEl.value : null;
  const finish = (fileData, fileName) => {
    (DATA.submissions[state.matterId]=DATA.submissions[state.matterId]||[]).unshift({role:state.role, kind, docType: docType||undefined, filedFor: filedFor||undefined, title, body, location: location||null, visibleRoles, date:'just now', status:'Submitted', fileData:fileData||null, fileName:fileName||null});
    (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Submissions", actor:currentPartyName(), action:`Submitted ${kind}: ${title}${location?` — 📍 ${location}`:''}${fileName?` (attached ${fileName})`:''}`});
    if(kind==='Legal Document' && docType && filedFor) chargeCourtFee(docType, title, filedFor);
    render();
  };
  const fileInput = document.getElementById('subFile');
  const f = fileInput && fileInput.files && fileInput.files[0];
  if(f){
    const reader = new FileReader();
    reader.onload = function(){ finish(reader.result, f.name); };
    reader.readAsDataURL(f);
  } else {
    finish(null, null);
  }
}
function markSubmissionReviewed(i){
  const rows = DATA.submissions[state.matterId]||[];
  const s = rows[i];
  if(!s) return;
  s.status = 'Reviewed';
  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Submissions", actor:currentPartyName(), action:`Marked reviewed: ${s.title}`});
  render();
}

// Owner-role inference for a two-sided item: whichever named party ISN'T the one who acted (`name`) owes the next
// step. Same convention already used by the Negotiation/Consents/Payment-Request decide-gates (`by !== currentPartyName()`).
function oppositeRole(name){
  const p = matter().parties.find(pp=>pp.name===name);
  if(!p) return null;
  if(p.role==='Plaintiff') return 'Defendant';
  if(p.role==='Defendant') return 'Plaintiff';
  return null;
}
// Pending Actions — pulled LIVE from every module's own current-state, not a separate static list that can drift out
// of sync with what Consents/Negotiation/Payment Requests/etc. actually show. Directly answers the user's ask:
// switching roles should surface exactly what's genuinely required of THAT role right now, and interfaces already
// exist on each source page (Approve/Decline, Accept/Reject, Pay Now, Mark responded) to act on it from there.
function computeLivePending(){
  const rows = [];
  (DATA.consents[state.matterId]||[]).forEach((c,i)=>{ if(c.status!=='Pending') return;
    const owner = oppositeRole(c.by); if(owner) rows.push({title:`Review consent request: ${c.subject}`, owner, due:'—', status:'Open', kind:'consent', refIdx:i});
  });
  (DATA.scheduleRequests[state.matterId]||[]).forEach((r,i)=>{ if(r.status!=='Pending') return;
    const owner = oppositeRole(r.requestedBy); if(owner) rows.push({title:`Review schedule change request: ${r.eventTitle}`, owner, due:'—', status:'Open', kind:'schedule', refIdx:i});
  });
  (DATA.expenses[state.matterId]||[]).forEach((e,i)=>{ if(e.status!=='Pending' && e.status!=='Reimbursement Requested') return;
    const owner = oppositeRole(e.paidBy); if(owner) rows.push({title:`Approve reimbursement: ${e.desc}`, owner, due:'—', status:'Open', kind:'expense', refIdx:i});
  });
  (DATA.negotiation[state.matterId]||[]).forEach((o,i)=>{ if(o.status!=='Pending') return;
    const owner = oppositeRole(o.by); if(owner) rows.push({title:`Decide on settlement offer: $${o.amount.toFixed(2)}`, owner, due:'—', status:'Open', kind:'negotiation', refIdx:i});
  });
  (DATA.paymentRequests[state.matterId]||[]).forEach((r,i)=>{ if(r.status!=='Pending') return;
    const owner = oppositeRole(r.by); if(owner) rows.push({title:`Pay requested payment: $${r.amount.toFixed(2)} — ${r.reason}`, owner, due:dueLabel(r.dueDate), status:'Open', kind:'paymentRequest', refIdx:i});
  });
  (DATA.rfeTracking[state.matterId]||[]).forEach((r,i)=>{ if(r.status!=='Open') return;
    rows.push({title:`Respond to RFE: ${r.subject}`, owner:'Lawyer', due:r.deadline, status:'Open', kind:'rfe', refIdx:i});
  });
  (DATA.submissions[state.matterId]||[]).forEach((s,i)=>{ if(s.status!=='Submitted') return;
    rows.push({title:`Review submission: ${s.title}`, owner:'CourtAdmin', due:'—', status:'Open', kind:'submission', refIdx:i});
  });
  const plans = computeInstallmentNotifications();
  plans.forEach(n=>{ rows.push({title:n.title, owner:n.owner, due:n.due, status:'Open', kind:'installment', refIdx:null}); });
  return rows;
}
function pendingActionCell(p){
  if(p.owner!==state.role) return '<span class="muted">—</span>';
  if(!ACTIONABLE_PENDING_KINDS.includes(p.kind)) return '<span class="muted">Open module to act</span>';
  return `<div class="inline-actions"><button class="btn-sm" onclick="openActionModal('${p.kind}',${p.refIdx},'approve')">${p.kind==='paymentRequest'?'Pay / Approve':'Approve'}</button><button class="btn-sm outline" onclick="openActionModal('${p.kind}',${p.refIdx},'reject')">Reject</button></div>${actionModalHtml(p.kind,p.refIdx)}`;
}
function pagePending(){
  const rows = computeLivePending();
  return `<h2>Pending Action System</h2>
  <p class="subtitle">Cross-module queue of actions owed by each role, computed live from Consents, Schedule Change Requests, Expenses, Negotiation, Payment Requests, Installment Plans, RFEs and Submissions — switch "Viewing as" above and this list changes to exactly what that role owes right now. Approve/Reject directly below (a reason is required to reject), or open the source module from the sidebar for full context.</p>
  <table><tr><th>Title</th><th>Owner Role</th><th>Due By</th><th>Status</th><th>Action</th></tr>
  ${rows.map(p=>`<tr><td>${p.title}</td><td>${chip(p.owner, p.owner===state.role?'primary':'default')}</td><td>${p.due}</td><td>${chip(p.status,'warning')}</td><td>${pendingActionCell(p)}</td></tr>`).join('') || `<tr><td colspan="5" class="muted">No pending actions.</td></tr>`}
  </table>`;
}

const PAGES = { dashboard:pageDashboard, family:pageFamily, legal:pageLegal, agreements:pageAgreements,
  activities:pageActivities, calendar:pageCalendar, messaging:pageMessaging, notes:pageNotes, journal:pageJournal,
  expenses:pageExpenses, payments:pagePayments, consents:pageConsents, notices:pageNotices, records:pageRecords,
  submissions:pageSubmissions, notifications:pageNotifications, pending:pagePending,
  medicalSettlement:pageMedicalSettlement, chargesCourtDates:pageChargesCourtDates,
  immigrationFilings:pageImmigrationFilings, negotiation:pageNegotiation };

function render(){
  renderSidebar();
  renderTopControls();
  document.getElementById('content').innerHTML = PAGES[state.page]();
}

render();
</script>
</body>
