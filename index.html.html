<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Court Application — Interactive Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --navy:#1B3A5C; --navy-dark:#122841; --teal:#2E7D6B;
    --bg:#F5F7F9; --card:#FFFFFF; --border:#E1E5EA;
    --text:#1F2937; --text-mute:#6B7280;
    --amber:#B45309; --amber-bg:#FEF3C7;
    --green:#166534; --green-bg:#DCFCE7;
    --red:#991B1B; --red-bg:#FEE2E2;
    --blue:#1E40AF; --blue-bg:#DBEAFE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 18px;position:sticky;top:0;z-index:10;flex-wrap:wrap;}
  .topbar h1{font-size:17px;font-weight:600;margin:0;}
  .spacer{flex:1;}
  .topbar select{background:#254A6E;color:#fff;border:1px solid #375F87;border-radius:6px;padding:6px 10px;font-size:13px;}
  .bell{position:relative;font-size:18px;cursor:default;padding:4px 8px;}
  .bell .count{position:absolute;top:-2px;right:0;background:#DC2626;color:#fff;font-size:10px;border-radius:8px;padding:1px 5px;}
  .layout{display:flex;min-height:calc(100vh - 52px);}
  .sidebar{width:250px;background:#fff;border-right:1px solid var(--border);padding:14px 0;flex-shrink:0;}
  .sidebar .grp{padding:8px 18px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mute);font-weight:700;margin-top:10px;}
  .navitem{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 18px;font-size:14px;color:var(--text);cursor:pointer;border-left:3px solid transparent;}
  .navitem:hover{background:#F0F3F6;}
  .navitem.active{background:#EAF1F7;border-left-color:var(--navy);font-weight:600;color:var(--navy);}
  .content{flex:1;padding:26px 32px;max-width:980px;}
  .content h2{font-size:22px;margin:0 0 4px;color:var(--navy);}
  .subtitle{color:var(--text-mute);font-size:13.5px;margin:0 0 20px;max-width:760px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .card h3{font-size:14px;margin:0 0 10px;}
  .item{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px;}
  .item b{font-size:13.5px;}
  .muted{color:var(--text-mute);font-size:12.5px;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:13.5px;}
  th{background:#F0F3F6;text-align:left;padding:9px 12px;font-size:12px;text-transform:uppercase;color:var(--text-mute);letter-spacing:.03em;}
  td{padding:9px 12px;border-top:1px solid var(--border);}
  .chip{display:inline-block;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:600;}
  .chip-default{background:#EEF1F4;color:#374151;}
  .chip-primary{background:var(--blue-bg);color:var(--blue);}
  .chip-success{background:var(--green-bg);color:var(--green);}
  .chip-warning{background:var(--amber-bg);color:var(--amber);}
  .chip-error{background:var(--red-bg);color:var(--red);}
  .party-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fff;}
  .filterchip{display:inline-block;padding:5px 12px;border-radius:16px;border:1px solid var(--border);font-size:12.5px;margin:0 6px 6px 0;cursor:pointer;background:#fff;}
  .filterchip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .thread-list button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:13px;}
  .thread-list button.active{border-color:var(--navy);background:#EAF1F7;}
  .msg{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff;}
  .alert{border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:13.5px;}
  .alert-error{background:var(--red-bg);color:var(--red);border:1px solid #FCA5A5;}
  .alert-info{background:var(--blue-bg);color:var(--blue);border:1px solid #93C5FD;}
  .disabled-btn{background:#D1D5DB;color:#6B7280;border:none;padding:9px 16px;border-radius:6px;font-size:13.5px;cursor:not-allowed;margin-bottom:16px;}
  .formbox{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:18px;}
  .formbox h3{font-size:14px;margin:0 0 10px;color:var(--navy);}
  .formbox label{display:block;font-size:12px;color:var(--text-mute);margin-bottom:3px;}
  .formbox input[type=text],.formbox input[type=number],.formbox select,.formbox textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;margin-bottom:10px;font-family:inherit;}
  .formbox textarea{resize:vertical;min-height:60px;}
  .btn-sm{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-sm.outline{background:#fff;color:var(--navy);border:1px solid var(--navy);}
  .btn-sm.teal{background:var(--teal);}
  .err-text{color:var(--red);font-size:12px;margin:-4px 0 8px;}
  .inline-actions{display:flex;gap:8px;margin-top:6px;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:#F5F8FB;}
  .backlink{background:none;border:none;color:var(--navy);font-size:13px;cursor:pointer;padding:0;margin-bottom:14px;font-weight:600;}
  .backlink:hover{text-decoration:underline;}
  .detailbox{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .detailbox dl{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;margin:0 0 16px;}
  .detailbox dt{color:var(--text-mute);font-size:12.5px;}
  .detailbox dd{margin:0;font-size:13.5px;}
</style>
</head>
<body>

<div class="topbar">
  <h1>Court Application — Prototype</h1>
  <div class="spacer"></div>
  <label style="font-size:12px;">Matter
    <select id="matterSelect" onchange="onMatterChange(this.value)"></select>
  </label>
  <label style="font-size:12px;">Viewing as
    <select id="roleSelect" onchange="onRoleChange(this.value)">
      <option>Plaintiff</option><option>Defendant</option><option>Lawyer</option>
      <option>Expert</option><option>Witness</option><option>CourtAdmin</option>
    </select>
  </label>
  <div class="bell">🔔<span class="count" id="notifCount">0</span></div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

// Generates a small, clearly-labeled SVG "document" as a data URL — used only so pre-seeded example rows have a real,
// openable attachment (no broken/decorative "📎" text). A file picked through the real <input type="file"> below is
// read via FileReader instead and opens the actual chosen file, not a mock.
function mockDocDataUrl(titleLine, subLines){
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = (subLines||[]).map(esc);
  const h = 90 + lines.length*24;
  const rows = lines.map((l,i)=>`<text x="20" y="${74+i*24}" font-family="Arial, sans-serif" font-size="14" fill="#1F2937">${l}</text>`).join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="440" height="${h}">
    <rect width="100%" height="100%" fill="#ffffff" stroke="#E1E5EA" stroke-width="2"/>
    <rect x="0" y="0" width="100%" height="36" fill="#1B3A5C"/>
    <text x="16" y="24" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">📎 ${esc(titleLine)}</text>
    <text x="16" y="56" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Illustrative attachment — generated for this prototype</text>
    ${rows}
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
(function attachMockDocuments(){
  Object.keys(DATA.expenses).forEach(mid=>{
    (DATA.expenses[mid]||[]).forEach(e=>{
      if(e.receipt && !e.fileData){

        e.fileName = 'receipt.svg';

  });
  // One seeded submission (the Witness Statement) is left without an attachment on purpose, to show attaching a
  // document is genuinely optional, not required.
  Object.keys(DATA.submissions).forEach(mid=>{
    (DATA.submissions[mid]||[]).forEach(s=>{
      if(s.kind !== 'Witness Statement' && !s.fileData){

        s.fileName = s.title.replace(/[^a-z0-9]+/gi,'_') + '.svg';
      }
    });
  });
})();

// Matter type — explicit field (Family/Commercial/PersonalInjury/CriminalDefense/Immigration), see DATA.matters
// comment above for why. isFamilyMatter() kept as a thin wrapper (minimal diff for existing callers).
function matterType(){ return matter().type; }
function isFamilyMatter(){ return matterType()==='Family'; }
function allowed(page){
  if(!ROLE_PAGES[state.role].includes(page)) return false;
  const mt = matterType();
  if((page==='notes' || page==='activities' || page==='journal') && mt!=='Family') return false;
  // Consents' predefined dropdown (Travel/Doctor/School) is family-specific — already a known flagged gap on the
  // Commercial matter from an earlier round (not silently invented a fix for); not spreading that same mismatch to
  // the 3 new matter types this round, so Consents stays Family+Commercial only.
  if(page==='consents' && mt!=='Family' && mt!=='Commercial') return false;
  // Messaging shows ONE shared thread to every party with matter access — correct for Family/Commercial/PersonalInjury
  // (civil, two-sided, nothing privileged), but WRONG for CriminalDefense/Immigration where Defendant-Lawyer or
  // Petitioner-Lawyer communication needs real privacy/privilege separation this simple shared-thread model doesn't
  // provide. Gated off rather than silently exposing privileged communication.
  if(page==='messaging' && !['Family','Commercial','PersonalInjury'].includes(mt)) return false;
  if(page==='medicalSettlement' && mt!=='PersonalInjury') return false;
  if(page==='chargesCourtDates' && mt!=='CriminalDefense') return false;
  if(page==='immigrationFilings' && mt!=='Immigration') return false;
  if(page==='negotiation' && mt!=='Commercial') return false;
  return true;
}

// ToneMeter — lightweight flagged-language check, run client-side as the user types. Pattern benchmarked from
// OurFamilyWizard's ToneMeter (Messages + Journal composers). Never blocks sending — advisory only.
const TONE_FLAG_WORDS = ["stupid","hate","idiot","never","always","ridiculous","pathetic","liar","lazy","worthless","shut up","screw you"];
function toneCheckHits(text){
  const lower = (text||'').toLowerCase();
  return TONE_FLAG_WORDS.filter(w=>lower.includes(w));
}
function updateToneMeter(inputId, outId){
  const el = document.getElementById(inputId);
  const out = document.getElementById(outId);
  if(!el || !out) return;
  const hits = toneCheckHits(el.value);
  out.innerHTML = hits.length
    ? `<div class="alert alert-error" style="padding:6px 10px;font-size:12px;margin:-2px 0 8px;">🔴 ToneMeter: this may read as emotionally charged — flagged: "${hits.join('", "')}". You can still send, but consider rephrasing.</div>`
    : (el.value.trim() ? `<div class="muted" style="font-size:11.5px;margin:-2px 0 8px;">🟢 ToneMeter — tone looks fine.</div>` : '');
}

function createMatter(){

  const nums = DATA.matters.map(m=>parseInt(m.id.split('-')[1],10)).filter(n=>!isNaN(n));
  const id = 'MAT-' + String((nums.length?Math.max(...nums):0)+1).padStart(4,'0');
  const parties = [{name:plaintiffName, role:'Plaintiff', contact:'—'}];
  if(defendantName) parties.push({name:defendantName, role:'Defendant', contact:'—'});
  DATA.matters.push({ id, type, title, caseNumber, court, status:'Active', opened:'today', parties });
  DATA.infoBank[id]=[]; DATA.agreements[id]=[]; DATA.activities[id]=[]; DATA.calendar[id]=[]; DATA.scheduleRequests[id]=[];
  DATA.messages[id]=[]; DATA.notes[id]=[]; DATA.journal[id]=[]; DATA.expenses[id]=[]; DATA.consents[id]=[]; DATA.notices[id]=[];
  DATA.audit[id]=[{ts:"just now", module:"System", actor:currentPartyName(), action:`Matter created: ${title}`}];
  DATA.notifications[id]=[]; DATA.submissions[id]=[]; DATA.paymentMethods[id]=[]; DATA.payments[id]=[];

function toggleCalFilter(c){ calFilters.has(c)?calFilters.delete(c):calFilters.add(c); render(); }
function clearCalFilter(){ calFilters.clear(); render(); }
function createCalendarEvent(){
  const title = document.getElementById('calTitle').value.trim();
  const cat = document.getElementById('calCat').value;
  const start = document.getElementById('calStart').value.trim();
  const end = document.getElementById('calEnd').value.trim();
  const errEl = document.getElementById('calErr');
  if(!title || !start){ errEl.textContent = "Add a title and a start time before creating the event."; return; }
  errEl.textContent = "";
  (DATA.calendar[state.matterId]=DATA.calendar[state.matterId]||[]).unshift({title, cat, legend:CAL_CATEGORIES[cat], start, end: end||start});
  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Calendar", actor:currentPartyName(), action:`Created calendar event: ${title} (${cat})`});
  render();
}
function requestScheduleChange(){
  const eventTitle = document.getElementById('chgEvent').value;
  const newStart = document.getElementById('chgStart').value.trim();
  const newEnd = document.getElementById('chgEnd').value.trim();
  const reason = document.getElementById('chgReason').value.trim();
  const errEl = document.getElementById('chgErr');
  if(!newStart || !reason){ errEl.textContent = "Add a proposed start time and a reason before submitting."; return; }
  errEl.textContent = "";
  (DATA.scheduleRequests[state.matterId]=DATA.scheduleRequests[state.matterId]||[]).unshift({eventTitle, requestedBy:currentPartyName(), newStart, newEnd: newEnd||newStart, reason, status:'Pending', date:'just now'});
  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Calendar", actor:currentPartyName(), action:`Requested schedule change: ${eventTitle} → ${newStart}`});
  render();
}
function decideScheduleChange(i, approve){
  const rows = DATA.scheduleRequests[state.matterId]||[];
  const r = rows[i];
  if(!r) return;
  r.status = approve ? 'Approved' : 'Declined';
  if(approve){
    const events = DATA.calendar[state.matterId]||[];
    const ev = events.find(e=>e.title===r.eventTitle);
    if(ev){ ev.start = r.newStart; ev.end = r.newEnd; }
  }
  (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Calendar", actor:currentPartyName(), action:`${approve?'Approved':'Refused'} schedule change: ${r.eventTitle}`});
  render();
}

function submitReport(kind){
  const title = document.getElementById('subTitle').value.trim();

  const errEl = document.getElementById('subErr');
  if(!title || !body){ errEl.textContent = "Add a title and content before submitting."; return; }
  errEl.textContent = "";
  const finish = (fileData, fileName) => {
    (DATA.submissions[state.matterId]=DATA.submissions[state.matterId]||[]).unshift({role:state.role, kind, title, body, location: location||null, visibleRoles, date:'just now', status:'Submitted', fileData:fileData||null, fileName:fileName||null});
    (DATA.audit[state.matterId]=DATA.audit[state.matterId]||[]).unshift({ts:"just now", module:"Submissions", actor:currentPartyName(), action:`Submitted ${kind}: ${title}${location?` — 📍 ${location}`:''}${fileName?` (attached ${fileName})`:''}`});
    render();
  };
  const fileInput = document.getElementById('subFile');
  const f = fileInput && fileInput.files && fileInput.files[0];
  if(f){
    const reader = new FileReader();
    reader.onload = function(){ finish(reader.result, f.name); };
    reader.readAsDataURL(f);
  } else {
    finish(null, null);
  }

function markSubmissionReviewed(i){

// Owner-role inference for a two-sided item: whichever named party ISN'T the one who acted (`name`) owes the next
// step. Same convention already used by the Negotiation/Consents/Payment-Request decide-gates (`by !== currentPartyName()`).
function oppositeRole(name){
  const p = matter().parties.find(pp=>pp.name===name);
  if(!p) return null;
  if(p.role==='Plaintiff') return 'Defendant';
  if(p.role==='Defendant') return 'Plaintiff';
  return null;
}
// Pending Actions — pulled LIVE from every module's own current-state, not a separate static list that can drift out
// of sync with what Consents/Negotiation/Payment Requests/etc. actually show. Directly answers the user's ask:
// switching roles should surface exactly what's genuinely required of THAT role right now, and interfaces already
// exist on each source page (Approve/Decline, Accept/Reject, Pay Now, Mark responded) to act on it from there.
function computeLivePending(){
  const rows = [];
  (DATA.consents[state.matterId]||[]).filter(c=>c.status==='Pending').forEach(c=>{
    const owner = oppositeRole(c.by); if(owner) rows.push({title:`Review consent request: ${c.subject}`, owner, due:'—', status:'Open'});
  });
  (DATA.scheduleRequests[state.matterId]||[]).filter(r=>r.status==='Pending').forEach(r=>{
    const owner = oppositeRole(r.requestedBy); if(owner) rows.push({title:`Review schedule change request: ${r.eventTitle}`, owner, due:'—', status:'Open'});
  });
  (DATA.expenses[state.matterId]||[]).filter(e=>e.status==='Pending'||e.status==='Reimbursement Requested').forEach(e=>{
    const owner = oppositeRole(e.paidBy); if(owner) rows.push({title:`Approve reimbursement: ${e.desc}`, owner, due:'—', status:'Open'});
  });
  (DATA.negotiation[state.matterId]||[]).filter(o=>o.status==='Pending').forEach(o=>{
    const owner = oppositeRole(o.by); if(owner) rows.push({title:`Decide on settlement offer: $${o.amount.toFixed(2)}`, owner, due:'—', status:'Open'});
  });
  (DATA.paymentRequests[state.matterId]||[]).filter(r=>r.status==='Pending').forEach(r=>{
    const owner = oppositeRole(r.by); if(owner) rows.push({title:`Pay requested payment: $${r.amount.toFixed(2)} — ${r.reason}`, owner, due:r.dueDate, status:'Open'});
  });
  (DATA.rfeTracking[state.matterId]||[]).filter(r=>r.status==='Open').forEach(r=>{
    rows.push({title:`Respond to RFE: ${r.subject}`, owner:'Lawyer', due:r.deadline, status:'Open'});
  });
  (DATA.submissions[state.matterId]||[]).filter(s=>s.status==='Submitted').forEach(s=>{
    rows.push({title:`Review submission: ${s.title}`, owner:'CourtAdmin', due:'—', status:'Open'});
  });
  return rows;
}
function pagePending(){
  const rows = computeLivePending();
  return `<h2>Pending Action System</h2>
  <p class="subtitle">Cross-module queue of actions owed by each role, computed live from Consents, Schedule Change Requests, Expenses, Negotiation, Payment Requests, RFEs and Submissions — switch "Viewing as" above and this list changes to exactly what that role owes right now. Act on each item from its own page (Consents, Payments, etc.) — the links back are in the sidebar.</p>
  <table><tr><th>Title</th><th>Owner Role</th><th>Due By</th><th>Status</th></tr>
  ${rows.map(p=>`<tr><td>${p.title}</td><td>${chip(p.owner, p.owner===state.role?'primary':'default')}</td><td>${p.due}</td><td>${chip(p.status,'warning')}</td></tr>`).join('') || `<tr><td colspan="4" class="muted">No pending actions.</td></tr>`}
  </table>`;
}

const PAGES = { dashboard:pageDashboard, family:pageFamily, legal:pageLegal, agreements:pageAgreements,
  activities:pageActivities, calendar:pageCalendar, messaging:pageMessaging, notes:pageNotes, journal:pageJournal,
  expenses:pageExpenses, payments:pagePayments, consents:pageConsents, notices:pageNotices, records:pageRecords,
  submissions:pageSubmissions, notifications:pageNotifications, pending:pagePending,
  medicalSettlement:pageMedicalSettlement, chargesCourtDates:pageChargesCourtDates,
  immigrationFilings:pageImmigrationFilings, negotiation:pageNegotiation };

function render(){
  renderSidebar();
  renderTopControls();
  document.getElementById('content').innerHTML = PAGES[state.page]();
}

render();
</script>
</body>
</html>
